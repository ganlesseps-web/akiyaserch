# 自治体マスタ — 再販/賃貸/民泊の「出口」判定用
#
# 使い方 (src/municipalities.py):
#   賃貸需要の核(rental_demand)も観光資源(tourism)も無く、かつ人口 1万人未満 の
#   自治体だけ ⚠️警告 を出す。人口の絶対値では除外しない。
#
# なぜ人口3万カットを採用しなかったか (2026-08 プロ壁打ちの結論):
#   3万で切ると 高梁(2.56万)/韮崎(2.78万)/甲州(2.70万)/新見(2.49万)/美作(2.32万) 等、
#   ユーザー自身が指定した供給源がほぼ全滅する。人口の絶対値より「賃貸需要の核が
#   あるか」「観光で民泊の出口があるか」の方が出口に直結する、が3専門家の一致見解。
#
# population の出典:
#   全49自治体とも 令和7年(2025)国勢調査 人口速報集計 (2025-10-01現在) で裏取り済み。
#   ※奈良5市町村・和歌山橋本市のみ県公式がExcel限定のため二次出典(uub.jp)で確認。
#   確報は2026年9月公表予定。更新時は e-Stat / 各県統計ページを参照。
#   ※ population 未設定(null)の自治体は警告を出さない (デフォルト通過の設計原則)。
#
# rental_demand の判定: 大工場・企業城下町 / 大学・高専 / 総合病院 / 自衛隊駐屯地 /
#                       大都市への通勤圏 のいずれかがある
# tourism の判定:       全国的に知られた観光資源 (城/温泉/ワイナリー/スキー場/
#                       世界遺産/国立公園/重伝建/有名景勝) がある

