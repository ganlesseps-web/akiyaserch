# ジモティ (jmty.jp) の収集対象。市区町村ごとの地域コード。
#
# URL の形: https://jmty.jp/{pref}/est-buy/g-214/{code}
#   est-buy = 不動産売買 / g-214 = 中古(マンション/一戸建て)
# 対象は config/municipalities.yaml の自治体 (=空き家バンクで既に見ている市町村) に揃える。
# 町村はジモティ上で「○○郡」単位にまとまるため、郡のページを1回だけ見て
# towns の町村名で住所照合する (郡内の対象外の町は normalize 後の city で弾かれる)。
#
# 「提携サイト」(不動産会社広告の転載) は詳細リンクが無く価格帯も予算外なので
# 取らない。個人の直接投稿だけを対象にする (空き家バンクに無い掘り出し物が狙い)。
# 2026-09-12: 実サイトから自動抽出。

