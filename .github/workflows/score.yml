name: score

on:
  # 自動 schedule は無効化中 (2026-05-26 ユーザー判断、API コスト管理)
  # 再開: 下記の schedule ブロックのコメントを外す
  # schedule:
  #   - cron: '10,40 * * * *'
  workflow_dispatch: {}

concurrency:
  group: score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          missing=""
          [ -z "$TURSO_DATABASE_URL" ] && missing="$missing TURSO_DATABASE_URL"
          [ -z "$GEMINI_API_KEY" ] && missing="$missing GEMINI_API_KEY"
          if [ -n "$missing" ]; then
            echo "::warning::Skipping AI scoring (missing:$missing). Configure in repo Secrets to enable."
            exit 0
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Run scoring
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m src.cli score --limit 50
